services:
  postgres:
    image: postgres:17
    container_name: hospital-archive-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - archive_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_archive -d hospital_archive"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  archive_postgres_data: