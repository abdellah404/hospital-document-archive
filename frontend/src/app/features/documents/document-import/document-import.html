<div class="min-h-screen bg-gray-100 p-6">

  <div class="mx-auto max-w-2xl rounded-xl bg-white p-6 shadow">

    <h1 class="mb-6 text-2xl font-bold">
      Import Document
    </h1>

    <div class="space-y-5">

      <div>
        <label class="mb-2 block text-sm font-medium">
          Hospitalization ID
        </label>

        <input
          type="text"
          [(ngModel)]="hospitalizationId"
          class="w-full rounded-lg border px-3 py-2"
          placeholder="Hospitalization UUID"
        />
      </div>

      <div>
        <label class="mb-2 block text-sm font-medium">
          PDF Document
        </label>

        <input
          type="file"
          accept="application/pdf"
          (change)="onFileSelected($event)"
          class="block w-full rounded-lg border p-2"
        />
      </div>

      @if (selectedFile) {
        <p class="text-sm text-gray-600">
          Selected:
          {{ selectedFile.name }}
        </p>
      }

      @if (message) {
        <p class="text-sm text-green-600">
          {{ message }}
        </p>
      }

      @if (errorMessage) {
        <p class="text-sm text-red-600">
          {{ errorMessage }}
        </p>
      }

      <button
        type="button"
        (click)="upload()"
        class="w-full rounded-lg bg-blue-600 px-4 py-2 font-medium text-white"
      >
        Import Document
      </button>

    </div>

  </div>

</div>
